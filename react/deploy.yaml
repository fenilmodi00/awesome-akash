---
version: "2.0"

services:
  web:
    # Using nginx-alpine to serve static React build files
    # For custom React apps, replace with your own Docker image
    image: nginx:alpine
    expose:
      - port: 80
        as: 80
        to:
          - global: true
    # Optional: Add environment variables for your React app
    # env:
    #   - "REACT_APP_API_URL=https://api.example.com"
    #   - "REACT_APP_ENV=production"

profiles:
  compute:
    web:
      resources:
        cpu:
          units: 0.5
        memory:
          size: 512Mi
        storage:
          size: 1Gi
  placement:
    akash:
      attributes:
        host: akash
      signedBy:
        anyOf:
          - "akash1365yvmc4s7awdyj3n2sav7xfx76adc6dnmlx63"
          - "akash18qa2a2ltfyvkyj0ggj3hkvuj6twzyumuaru9s4"
      pricing:
        web: 
          denom: uakt
          amount: 10000

deployment:
  web:
    akash:
      profile: web
      count: 1
